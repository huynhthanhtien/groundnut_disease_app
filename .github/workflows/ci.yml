name: CI

# Chạy kiểm tra chất lượng trên mỗi lần push vào main và mỗi pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Giữ khớp với phiên bản Flutter đang dùng ở máy (xem .metadata).
  # Nâng Flutter thì sửa cả ở đây và trong release.yml.
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Tải dependencies
        run: flutter pub get

      - name: Phân tích mã nguồn
        run: flutter analyze

      - name: Chạy unit + widget test
        run: flutter test
